<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traductor de señas</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f0f4ff;
      padding: 20px;
    }

    h1 { color: #2346a0; }

    #resultado {
      font-size: 28px;
      font-weight: bold;
      margin: 20px;
    }

    #webcam canvas {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
    }

    #lista { font-size: 18px; }
  </style>
</head>

<body>
  <h1>🤟 Traductor de señas</h1>
  <p>Coloca tu mano frente a la cámara.</p>

  <p id="estado">Iniciando cámara y modelo...</p>
  <div id="webcam"></div>
  <div id="resultado">Cargando modelo...</div>
  <div id="lista"></div>

  <script>
    const URL_MODELO = "./";

    let modelo;
    let camara;
    let activo = false;
    let procesando = false;

    async function iniciar() {
      try {
        document.getElementById("estado").textContent =
          "Cargando modelo...";

        modelo = await tmImage.load(
          URL_MODELO + "model.json",
          URL_MODELO + "metadata.json"
        );

        document.getElementById("estado").textContent =
          "Solicitando permiso para la cámara...";

        camara = new tmImage.Webcam(300, 300, true);
        await camara.setup();
        await camara.play();

        document.getElementById("webcam").replaceChildren(
          camara.canvas
        );

        activo = true;

        document.getElementById("estado").textContent =
          "Cámara activa";

        predecir();

      } catch (error) {
        console.error(error);
        document.getElementById("estado").textContent =
          "No se pudo iniciar. Revisa el permiso de cámara y los archivos del modelo.";
        document.getElementById("resultado").textContent =
          error.message || "Error al iniciar.";
      }
    }

    async function predecir() {
      if (!activo || procesando) return;

      procesando = true;

      try {
        camara.update();

        const resultados = await modelo.predict(camara.canvas);
        resultados.sort((a, b) => b.probability - a.probability);

        const mejor = resultados[0];

        if (mejor && mejor.probability >= 0.70) {
          document.getElementById("resultado").textContent =
            "Seña: " + mejor.className;
        } else {
          document.getElementById("resultado").textContent =
            "No se reconoce la seña";
        }

        document.getElementById("lista").innerHTML =
          resultados.map(r =>
            `<p>${r.className}: ${(r.probability * 100).toFixed(1)}%</p>`
          ).join("");

      } catch (error) {
        console.error(error);
        activo = false;
        document.getElementById("estado").textContent =
          "Error al reconocer. Revisa el modelo.";
      } finally {
        procesando = false;
      }

      if (activo) setTimeout(predecir, 150);
    }

    // Iniciar automáticamente al abrir la página.
    window.addEventListener("load", iniciar);
  </script>
</body>
</html>
</body>
</html>
